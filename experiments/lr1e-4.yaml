# 實驗:降低學習率峰值 4e-4 → 1e-4
#
# 用法(疊加在基準 config 之上,後者覆蓋前者):
#   srun -n 8 python train.py fit --config config.yaml --config experiments/lr1e-4.yaml
#
# ── 動機 ────────────────────────────────────────────────────────────────
# 前一次訓練(version_233052,105k steps / 231 epochs / 6.7 h)中段發散:
#   val_loss  0.3585 → 0.3444 → 0.5077 → 0.4137 → 1.8873 → 1.3171 → ... → 0.3317
#   最佳 0.30065(早期),最終 0.33168 —— 結束時比中途最好的狀態還差
#
# 把 LR 與 val_loss 的取樣點對齊,得到經驗閾值:
#   LR 4e-4 → 不穩   |  LR 3e-4 → 發散最嚴重(1.89)
#   LR 2e-4 → 仍不穩 |  LR ≤1e-4 → 穩定
# ⇒ 峰值設 1e-4。cosine 的「前大後小」形狀不變,只是把峰值壓到穩定區間內。
#
# ── 對照設計 ────────────────────────────────────────────────────────────
# 相對 version_233052【只改 lr 一項】,其餘(Vt/Vr、R=41、bf16、max_steps
# 105000、batch 4)全部相同,因此結果可歸因。
# 這是為了修正上一輪「一次變更四項、無法歸因」的實驗設計缺陷。
model:
  optimizer_args:
    lr: 0.0001
