# 短診斷 C:診斷 A 的對照組 —— 只改 max_steps,精度與 LR 都維持基準值
#
#   sbatch --export=ALL,RUNDIR=runs/diag_C_ctrl,OVERLAY=experiments/diag_C_ctrl_short.yaml \
#          job_scripts/train_h200.sh
#
# ── 為什麼需要這一組 ────────────────────────────────────────────────────
# 診斷 A(fp32)與 B(lr5e-5)都為了縮短時間而把 max_steps 105000 → 13600。
# 但 cosine 退火曲線【由 max_steps 決定】,所以這一改同時改變了 LR 軌跡:
#
#     step        A/B 的 LR      原始訓練的 LR
#      3500        3.6e-4          4.0e-4
#      5400        2.9e-4          4.0e-4      ← 原始在此開始失控
#      8000        1.7e-4          4.0e-4
#
# ⇒ A 其實改了兩件事(精度 + LR 軌跡),B 也是(峰值 LR + LR 軌跡),
#   兩者都【無法單獨歸因】。這正是上一輪「一次改五項」的同一種錯誤。
#
# 本組把精度與 LR 都留在基準值(bf16-mixed / 4e-4),【只改 max_steps】,
# 因此與診斷 A 之間【只差精度一項】,構成真正的單變數對照。
#
# ── 判讀 ────────────────────────────────────────────────────────────────
# 原始訓練的惡化時點很銳利(逐千步中位數):
#     step 3000-3999   0.204     ← 仍健康
#     step 4000-4999   2.254     ← 11 倍跳升,最大 576
#     step 5000-5999  72.15
#
#   C 在 step ~4000 同樣爆掉  → 精度不是主因,主因是【持續維持峰值 LR】
#                                (因為 A 與 C 只差精度,而 A 沒爆)
#   C 維持 O(1) 到 13600 步   → 主因是【bf16 精度】
#                                (因為 C 與原始只差 LR 軌跡,而軌跡在前 4000 步幾乎相同)
trainer:
  max_steps: 13600
  max_epochs: 30
