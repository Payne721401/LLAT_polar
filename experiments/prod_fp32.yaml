# 正式訓練:fp32 + LR 4e-4(峰值不變),max_steps 依 fp32 的實測吞吐重算
#
#   sbatch --export=ALL,RUNDIR=runs/prod_fp32,OVERLAY=experiments/prod_fp32.yaml \
#          job_scripts/train_h200.sh
#
# ── 為什麼是 fp32 ────────────────────────────────────────────────────────
# 2026-08-04 的三組短診斷(各 13,571 步)給出乾淨的 2×2:
#
#                   fp32              bf16
#     LR 4e-4    A: 0.2275 ✅      C: 9.843 ❌ / 原始 233052: 147 ❌
#     LR 5e-5    (未測)            B: 0.2812 ✅
#                   ↑ 梯度範數中位數,baseline 為 0.28
#
# 診斷 A 與 C【只差精度一項】,C 爆了 A 沒爆 ⇒ bf16 是必要條件。
# 診斷 A 同時也洗清了 R=41、vt/vr、batch 32 三個嫌疑:A 具備這三項卻完全健康。
#
# 選 fp32 而非「bf16 + LR 5e-5」的理由:
#   - fp32 在【兩條獨立證據】上都穩:學姊 baseline 跑了 199.6 h,以及診斷 A
#   - 保留 4e-4 的峰值 LR,學習能力不打折(5e-5 是把 LR 壓進安全區的權宜作法)
#   - 代價僅約 1.5× 牆鐘,而一次爆炸會浪費整整 9 小時
#
# 之後值得試 `16-mixed`(fp16):尾數 10 bits > bf16 的 7 bits,速度與 bf16 相同,
# 且【原版 LLAT 就是用 fp16 訓練成功的】,可望把 1.5× 的成本拿回來。
#
# ── max_steps 怎麼算出來的 ──────────────────────────────────────────────
# ⚠️ 換精度【必須】重算 max_steps —— cosine 的退火曲線由它決定,
#    沿用 bf16 的 105,000 會讓 fp32 在時限內跑不完、退火只走一半,
#    重蹈學姊 baseline「LR 停在峰值 94%」的覆轍。
#
#   實測吞吐(端到端,含驗證與存檔):
#       bf16   105,000 步 / 6.7 h   ≈ 15,700 步/h
#       fp32    13,571 步 / 79 min  ≈ 10,700 步/h
#
#       8 h → 85,600 | 9 h → 96,300 | 10 h → 107,000 | 12 h → 128,400
#
# 下面取 9 小時對應的 96,000。若你的額度不同,照上表改這個數字。
trainer:
  precision: '32'
  max_steps: 96000
