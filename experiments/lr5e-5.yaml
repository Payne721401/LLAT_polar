# 實驗:降低學習率峰值 4e-4 → 5e-5
#
# 用法(疊加在基準 config 之上,後者覆蓋前者):
#   srun -n 8 python train.py fit --config config.yaml --config experiments/lr5e-5.yaml
#
# ── 動機 ────────────────────────────────────────────────────────────────
# 前一次訓練(version_233052,105k steps / 231 epochs / 6.7 h)中段發散:
#   val_loss  0.3585 → 0.3444 → 0.5077 → 0.4137 → 1.8873 → 1.3171 → ... → 0.3317
#   最佳 0.30065(早期),最終 0.33168 —— 結束時比中途最好的狀態還差
#
# 把 LR 與 val_loss 的取樣點對齊,得到經驗閾值:
#   把 231 個驗證點的 val_loss 對「當時 LR」作圖(analysis/training_analysis.ipynb 圖 3):
#     spike(>1.3× 收斂值)共 76 次,全部發生在 LR > 6.06e-05
#     LR < 6.06e-05 之後,一次 spike 都沒有
# ⇒ 經驗穩定閾值 ≈ 6e-5,峰值取 5e-5(留餘裕)。
#   cosine 的「前大後小」形狀不變,只是把整條曲線壓到穩定區間內。
#
# warmup 維持 1000 步不變:第一次 spike 在 step ~5,400,遠在 warmup(step 1000)
# 結束之後,故 warmup 與本問題無關,改它只會讓實驗無法歸因。
#
# ── 對照設計 ────────────────────────────────────────────────────────────
# 相對 version_233052【只改 lr 一項】,其餘(Vt/Vr、R=41、bf16、max_steps
# 105000、batch 4)全部相同,因此結果可歸因。
# 這是為了修正上一輪「一次變更四項、無法歸因」的實驗設計缺陷。
model:
  optimizer_args:
    lr: 0.00005
