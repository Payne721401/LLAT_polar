# 短診斷 D:fp16 —— 精度軸上唯一還沒測的一格
#
#   sbatch --export=ALL,RUNDIR=runs/diag_fp16,OVERLAY=experiments/diag_fp16_short.yaml \
#          job_scripts/train_h200.sh
#
# ── 為什麼要測 fp16 ─────────────────────────────────────────────────────
# 2026-08-04 的診斷確認梯度爆炸的成因是 bf16 精度:
#
#                   fp32              fp16              bf16
#     LR 4e-4    A: 0.23 ✅        ❓ 本組           C: 9.8 ❌ / 原始: 147 ❌
#     LR 5e-5    (低資訊)          —                 B: 0.28 ✅
#                   ↑ gradient_2norm 中位數
#
# fp16 在【兩個軸上都優於 bf16】:
#     尾數位數   fp32 24 > fp16 11 > bf16 8      (相對誤差 1e-7 / 5e-4 / 4e-3)
#     範圍       fp16 靠 GradScaler 自動補償,bf16 靠指數位數
# 而【原版 LLAT 就是用 16-mixed(fp16)訓練成功的】,範圍從來不是這個模型的瓶頸。
#
# 若本組健康,就能保留 bf16 的速度(比 fp32 快 1.5×)又拿回精度,
# 正式訓練即可用 fp16 + 4e-4,不必在「降精度」與「降 LR」之間二選一。
#
# ── 溢位/下溢的事前檢查(實測,非估計)────────────────────────────────
# 取原始訓練健康期(step 1,000–3,500)全部 191 層的梯度範數:
#
#     全體最大   0.2764      距 fp16 上限 65,504 還有 2.4e5 倍餘裕
#     全體最小   9.98e-08    低於 fp16 最小正規數 6.1e-5 ⇒ 無 scaler 會下溢
#     動態範圍   10^6.4      而 fp16 正規範圍跨度為 10^9 ⇒ 裝得下
#
# 代入 GradScaler 預設初始縮放 65536:
#     最大 × 65536 = 1.81e4   ✅ 未達上限
#     最小 × 65536 = 6.5e-3   ✅ 遠高於最小正規數
#
# ⇒ 溢位與下溢在理論上都不成立。(此檢查只涵蓋梯度;前向激活值因輸入已標準化、
#   到處是 LayerNorm、attention 有 1/√d 縮放而為 O(1),且原版已實證。)
#
# ── 判讀 ────────────────────────────────────────────────────────────────
# 與診斷 A(fp32)、C(bf16)使用【完全相同的排程】(max_steps 13600),
# 三者只差精度,可直接比較:
#
#     A fp32   梯度中位 0.2275   最大  9.2   >2.0  0.6%
#     C bf16   梯度中位 9.843    最大 7099   >2.0 56.2%
#
#   本組接近 A  → fp16 可用,正式訓練改用 fp16 + 4e-4(比 fp32 快 1.5×)
#   本組接近 C  → 11 bits 尾數仍不足,退回 fp32 或 bf16 + 低 LR
#
# 另可在 job_logs/*.err 檢查 GradScaler 是否頻繁縮減(訊息含 "scale"):
# 偶爾減半屬正常(它在探測上限);持續減半代表真的在溢位。
trainer:
  precision: '16-mixed'
  max_steps: 13600
  max_epochs: 30
