# lightning.pytorch==2.4.0
seed_everything: 2
ckpt_path: null
trainer:  
  # logger:
  #   class_path: lightning.pytorch.loggers.TensorBoardLogger
  #   init_args:
  #     save_dir: lightning_logs
  #     name: LLAT_test1      
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1    # how many nodes (more nodes)
  # 精度:原版 LLAT 用 fp16 且訓練成功。fp32 慢約 2 倍。
  # 若遇到 NaN/不穩,改 'bf16-mixed'(H200 支援,指數範圍同 fp32),不要退回 '32'
  precision: '16-mixed'
  callbacks: null
  fast_dev_run: false
  max_epochs: null
  min_epochs: null
  # ⚠️ max_steps 決定 cosine 學習率的退火曲線 —— 必須設成「跑得完」的數字!
  #    設太大(如 1600000)但只跑 15% ⇒ lr 幾乎不退火 ⇒ 模型無法收斂到底(學姊那次的問題)
  #    做法:先跑 job_scripts/calibrate.sh 量出每秒步數,再回推:
  #         max_steps = 每秒步數 × 總預算秒數 × 0.9
  max_steps: 1600000        # ← TODO: 校準後改成務實值
  min_steps: null
  max_time: null            # 由 SLURM 的 48h 上限管控,分段續訓
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: null
  log_every_n_steps: 29
  enable_checkpointing: true
  enable_progress_bar: false
  enable_model_summary: true
  accumulate_grad_batches: 1
  gradient_clip_val: 2
  gradient_clip_algorithm: 'norm'
  # deterministic: true
  deterministic: 'warn'
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 100
  default_root_dir: null
  # change swt block position bias to relative
data:
  n_workers: 10             # 每 task 有 12 cores;polar 內插吃 CPU,worker 太少會讓 GPU 空等
  batch_size: 4
  # batch_size: 32
  # pin_memory: true
  persistent_workers: true
  # multiprocessing_context: spawn
  combined_nc_input: true
  root_dir: '/work/yungyun0721/TC_dataset/DLDA_data/ERA5_DLDA_data/labeled_and_obs_data_with_vt_vr'
  # data_tar: '/nwpr/wfc/com136/data/DLAMP.ty.plus.tar'
  # fast_dir: '/dev/shm/DLAMP.ty'
  stat_mean_file: 'utils/stat_mean.nc'
  stat_std_file: 'utils/stat_std.nc'
  train_start: 2007
  train_end: 2018
  val_start: 2018
  val_end: 2020
  test_start: 2020
  test_end: 2021
  upper_variables: [u,v,t,q,z,w]
  surface_variables: [u10, v10, t2m, d2m, msl, sp, tcwv, tp, mtnlwrf, sst_filled, f, solar, hgt, landmask,  diurnal_sin, diurnal_cos, doy_sin, doy_cos]
  ingest_space_info: true # will add `lon` and `lat` as additional variable layers below the surface variables, remember to add `lon` and `lat` to `surface_vars` in the `model` section
  # data_spatial_shape: [13, 81, 81]
  # 徑向解析度 Δr = r_degree_max/(R-1)。來源 ERA5 是 0.25°,R=41 即完全匹配、不做上採樣。
  # ⚠️ ceil(R/8) 必須是【偶數】,否則 DownSample 觸發 GetPad2D 的 5D replicate 限制而崩潰(B8)。
  #    可用值:41(0.250°) 64(0.159°) 80(0.127°) 96(0.105°) 105(0.096°) 201(0.050°)
  data_spatial_shape: [13, 41, 180]
  r_degree_max: 10
  original_resolution: 0.25

model:
  # data_spatial_shape: [13,81,81]
  data_spatial_shape: [13,41,180]
  pressure_levels: [50, 100, 150, 200, 250, 300, 400, 500, 600, 700, 850, 925, 1000]
  upper_vars: [u,v,t,q,z,w]
  surface_vars: [u10, v10, t2m, d2m, msl, sp, tcwv, tp, mtnlwrf, sst_filled, f, solar, hgt, landmask,  diurnal_sin, diurnal_cos, doy_sin, doy_cos, lon, lat]
  depths: [2, 6]
  heads: [6, 12]
  embed_dim: 192
  patch_shape: [2, 8, 6]
  window_shape1: [2, 10, 15]
  window_shape2: [2, 8, 10]
  surface_weight: 0.25
  optimizer_name: AdamW
  optimizer_args:
    lr: 0.0004
    # weight_decay: 3e-6
  lr_scheduler_name: cosine
  lr_scheduler_args:
    warmup_steps: 1000
  constant_mask_paths: null
  # - '/home/gwfrank5/era5_tw/constant_masks/land_mask.npy'
  # - '/home/gwfrank5/era5_tw/constant_masks/soil_type.npy'
  # - '/home/gwfrank5/era5_tw/constant_masks/topography.npy'
  smoothing_kernel_size: null
  residual: false
  res_conn_after_smooth: false
  segmented_smooth: false
  segmented_smooth_boundary_width: 8
  
  
