# ## best
# Y.-Y. Cheng's polar baseline (R=201, radial spacing 0.05 deg, u/v wind).
onnx_version: LLATty_polar_v1
onnx_path: onnx/LLATty_polar_v1.onnx

# --- Polar grid -----------------------------------------------------------
# These three values MUST match the training config.yaml. Everything else
# (radius in cells, Cartesian domain size, sampling centre) is derived by
# DLAMPty_inference instead of being hardcoded.
polar:
  data_spatial_shape: [13, 201, 180]   # (Z, R, Theta)
  r_degree_max: 10                     # maximum radius, DEGREES
  original_resolution: 0.25            # source spacing, DEGREES PER CELL
  wind_representation: uv              # Cartesian components; no rotation needed

upper_vars: ['u', 'v', 't', 'q', 'z', 'w']
surface_vars: ['u10', 'v10', 't2m', 'd2m', 'msl', 'sp', 'tcwv', 'tp', 'mtnlwrf', 'sst_filled', 'f', 'solar', 'hgt', 'landmask', 'diurnal_sin', 'diurnal_cos', 'doy_sin', 'doy_cos']
pressure_levels: [50, 100, 150, 200, 250, 300, 400, 500, 600, 700, 850, 925, 1000]
ingest_space_info: True

upper_units: ["m/s", "m/s", "K", "kg kg**-1", "m**2 s**-2", "Pa s**-1"]
surface_units: ["m/s", "m/s", "K", "K", "Pa", "Pa", "kg m**-2", "m", 'W m**-2', 'K', '1/s', 'W m**-2', 'm', '1', '1', '1', '1', '1']

stat_mean_file: utils/stat_mean.nc
stat_std_file: utils/stat_std.nc
stat_mean_upper_file:
stat_std_upper_file:
stat_mean_sfc_file:
stat_std_sfc_file: