# LLAT polar - vt/vr model, R=41 (radial spacing matched to the ERA5 source grid)
#
# Trained by config.yaml (bf16-mixed, peak LR 5e-5, max_steps 105000);
# best checkpoint vl0.2499700.
#
# The three values under `polar:` MUST match the training config.yaml verbatim.
# If they do not, the model sees a different geometry at inference than it was
# trained on: the result is wrong and nothing reports an error. Everything else
# (radius in cells, Cartesian domain size, sampling centre) is derived from them
# rather than hardcoded - that is what S2 fixed.
onnx_version: LLAT_polar_vtvr_v1
onnx_path: onnx/LLAT_polar_vtvr_v1.onnx

# --- Polar grid -----------------------------------------------------------
polar:
  # (Z, R, Theta); copied from config.yaml data.data_spatial_shape
  data_spatial_shape: [13, 41, 180]
  # Maximum radius in DEGREES; copied from config.yaml data.r_degree_max
  r_degree_max: 10
  # Source grid spacing in DEGREES PER CELL; from config.yaml data.original_resolution
  original_resolution: 0.25
  # Wind representation: 'uv' for Cartesian components, 'vt_vr' for
  # tangential/radial. vt_vr requires an inverse rotation after polar_to_latlon
  # before the field can be handed to FCNV2 (see wind_convention below).
  wind_representation: vt_vr
  # Sign convention of the stored vt/vr, needed to invert the rotation.
  # Measured on 2026-08-07 with tools/verify_vtvr_convention.py against
  #   .../2020/202022W/202022W_2020103118_170kt_combined.nc
  # RMSE was exactly 0.0000 m/s for both the surface and the upper-air pair,
  # against 10.7 and 12.4 m/s for the respective runners-up, so the fit is not
  # merely the best available - the dataset was generated by this formula about
  # the array centre (40, 40), which incidentally confirms the sampling centre.
  #
  #     vt =  u*sin(theta) + v*cos(theta)
  #     vr = -u*cos(theta) + v*sin(theta)
  #
  # With ERA5's descending latitude (row index runs south) that means vt is
  # positive counter-clockwise and vr is positive INWARD. That independently
  # explains the sign pattern in the statistics file, which otherwise reads as a
  # physically impossible secondary circulation: vr is positive at low levels
  # (inflow) and negative aloft (outflow), and vt is positive at low levels
  # (cyclonic) and negative aloft (anticyclonic outflow) - a textbook TC.
  wind_convention: ccw_inward_flip

# --- Variables ------------------------------------------------------------
# Identical to the Cartesian version except for how wind is represented:
# u,v -> vt,vr and u10,v10 -> vt10,vr10.
upper_vars: ['vt', 'vr', 't', 'q', 'z', 'w']
surface_vars: ['vt10', 'vr10', 't2m', 'd2m', 'msl', 'sp', 'tcwv', 'tp', 'mtnlwrf', 'sst_filled', 'f', 'solar', 'hgt', 'landmask', 'diurnal_sin', 'diurnal_cos', 'doy_sin', 'doy_cos']
pressure_levels: [50, 100, 150, 200, 250, 300, 400, 500, 600, 700, 850, 925, 1000]
# True => the Dataset appends lon and lat as two extra surface layers (20 total)
ingest_space_info: True

upper_units: ["m/s", "m/s", "K", "kg kg**-1", "m**2 s**-2", "Pa s**-1"]
surface_units: ["m/s", "m/s", "K", "K", "Pa", "Pa", "kg m**-2", "m", 'W m**-2', 'K', '1/s', 'W m**-2', 'm', '1', '1', '1', '1', '1']

# --- Normalisation statistics --------------------------------------------
# Produced by tools/compute_vtvr_stats.py, which only ADDS vt/vr/vt10/vr10 on
# top of the original file; the other 31 variables compare bit-for-bit (ratio 1.0).
stat_mean_file: utils/stat_mean_vtvr.nc
stat_std_file: utils/stat_std_vtvr.nc
stat_mean_upper_file:
stat_std_upper_file:
stat_mean_sfc_file:
stat_std_sfc_file:
